<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Fieldnote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <section class="brand">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true"></span>
        Fieldnote
      </div>
      <figure class="quote">
        <blockquote>
          <p>“I log in and I’m already mid-sentence.”</p>
        </blockquote>
      </figure>
    </section>

    <main class="form-panel">
      <div class="form-wrap">
        <h1>Log in</h1>
        <p class="hint">Use the email you signed up with.</p>

        <form action="/login" method="post">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" required>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" name="remember"> Keep me logged in
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit">Log in</button>
        </form>

        <p class="footer">New to Fieldnote? <a href="#">Create an account</a></p>
      </div>
    </main>
  </div>
</body>
</html>
